name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          grep -v "^numba" requirements-sim.txt > requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Pytest
        run: python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Viewer tests
        run: node --test viz/test/*.test.js
